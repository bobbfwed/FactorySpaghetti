<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Factory Spaghetti — piece gallery</title>
<link rel="stylesheet" href="ui.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  html, body { overflow: auto; height: auto; }
  body { width: 1440px; margin: 0 auto; background: #140d09; }
  header { height: 96px; display: flex; align-items: center; gap: 16px; padding: 0 36px; background: var(--print), var(--panel); box-shadow: 0 1px 0 rgba(255,255,255,.06); }
  header .mark { width: 42px; height: 42px; }
  header h1 { margin: 0; font-size: 24px; font-weight: 900; }
  header p { margin: 3px 0 0; color: var(--text-2); font-size: 13.5px; }
  header .legend { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 12.5px; color: var(--text-2); }
  header .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .stage { position: relative; width: 1440px; }
  .stage canvas { display: block; width: 1440px; }
  #c1 { height: 840px; }
  #c2 { height: 500px; }
  .band { height: 46px; display: flex; align-items: center; padding: 0 36px; gap: 12px; background: var(--panel); box-shadow: inset 0 1px 0 rgba(255,255,255,.05), inset 0 -1px 0 rgba(255,255,255,.04); }
  .band .muted { font-size: 13px; }
  .lbl { position: absolute; transform: translate(-50%, 0); text-align: center; white-space: nowrap; pointer-events: none; }
  .lbl b { display: inline-block; font-size: 14px; font-weight: 800; color: var(--text); background: rgba(14,14,16,.82); padding: 4px 10px; border-radius: 8px; box-shadow: 0 4px 12px rgba(0,0,0,.4); }
  .lbl small { display: block; margin-top: 4px; font-size: 11.5px; color: #cfc9bd; text-shadow: 0 1px 3px rgba(0,0,0,.9); }
  .ph, .lbl b.ph { color: var(--gold); }
</style>
</head>
<body>
<header>
  <svg class="mark" viewBox="0 0 40 40"><polygon points="20,2 36,11 36,29 20,38 4,29 4,11" fill="#efede6"/><g fill="#e8b730"><path d="M9 22h4l3-4-3-4H9l3 4z"/><path d="M16 22h4l3-4-3-4h-4l3 4z"/><path d="M23 22h4l3-4-3-4h-4l3 4z"/></g><path d="M8 27a3 3 0 0 1 6 0z" fill="#141416"/></svg>
  <div><h1>Piece gallery</h1><p>Every component as it appears on the digital table, modelled from the printed pieces. Sizes follow the print files.</p></div>
  <div class="legend"><span><span class="sw" style="background:var(--blue)"></span>Blue</span><span><span class="sw" style="background:var(--red)"></span>Red</span><span><span class="sw" style="background:var(--orange)"></span>Orange</span><span><span class="sw" style="background:var(--green)"></span>Green</span><span class="ph">● placeholder: no printed version yet</span></div>
</header>
<div class="stage" id="s1"><canvas id="c1"></canvas></div>
<div class="band"><span class="label" style="color:var(--text-2)">Small pieces</span><span class="muted">shown 1.6× closer than the tiles above</span></div>
<div class="stage" id="s2"><canvas id="c2"></canvas></div>
<script type="module">
import { mountTable } from './table.js';
const PLACEHOLDER = new Set(['Deck', 'Teleporter', 'Starting player', 'Dice', 'Leverage card · face', 'Leverage card · back']);
function labels(t, stage) {
  for (const l of t.labels()) {
    const d = document.createElement('div'); d.className = 'lbl';
    d.innerHTML = `<b${PLACEHOLDER.has(l.text) ? ' class="ph"' : ''}>${l.text}</b>${l.sub ? `<small>${l.sub}</small>` : ''}`;
    const r = stage.getBoundingClientRect();
    d.style.left = (l.x - r.left) + 'px'; d.style.top = (l.y - r.top + 8) + 'px';
    stage.appendChild(d);
  }
}
const t1 = mountTable(document.getElementById('c1'), { variant: 'gallery-large', camera: { viewHeight: 352, target: [12, 4], elevation: 44, shift: [0, -0.02] } });
labels(t1, document.getElementById('s1'));
const t2 = mountTable(document.getElementById('c2'), { variant: 'gallery-small', camera: { viewHeight: 122, target: [-12, 10], elevation: 36, shift: [0, -0.04] } });
labels(t2, document.getElementById('s2'));
window.__ready = true;
</script>
</body>
</html>
