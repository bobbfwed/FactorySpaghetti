<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Factory Spaghetti — place a piece (phone)</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="phone.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<style>
  #ghostBtns { position: absolute; display: flex; gap: 10px; align-items: center; }
  #ghostBtns .round { width: 46px; height: 46px; }
  #ghostBtns .ok { background: var(--gold); color: var(--ink); box-shadow: 0 0 0 3px rgba(232,183,48,.25), 0 6px 16px rgba(0,0,0,.5); }
  #ghostBtns .ok svg { width: 22px; height: 22px; }
  #drawn { position: absolute; left: 10px; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px 0 10px; border-radius: 10px; font-size: 12.5px; color: var(--text-2); }
  #drawn b { color: var(--text); font-weight: 750; }
</style>
</head>
<body>
<canvas class="table" id="table"></canvas>
<div class="layer">
  <div class="chips">
    <button class="round" style="width:44px;height:44px;flex:none" aria-label="Game menu"><i class="ic" data-icon="menu"></i></button>
    <div class="chip-seat tray"><span class="stripe" style="background:var(--red)"></span>
      <div class="col"><span class="nm">Alex</span><span class="st">away · bot in 0:42</span></div>
      <span class="pips" data-pips="1" style="margin-left:auto"></span></div>
    <div class="chip-seat tray"><span class="stripe" style="background:var(--orange)"></span>
      <div class="col"><span class="nm">Smart Bot</span><span class="st" style="color:var(--text-2)">bot</span></div>
      <span class="pips" data-pips="0" style="margin-left:auto"></span></div>
  </div>
  <div class="cam-col">
    <button class="round" aria-label="Rotate 60 degrees"><i class="ic" data-icon="rotate"></i></button>
    <button class="round" aria-label="Re-centre"><i class="ic" data-icon="recenter"></i></button>
    <button class="round" aria-label="Top-down view"><i class="ic" data-icon="topdown"></i></button>
  </div>

  <div id="ghostBtns">
    <button class="round" aria-label="Cancel"><i class="ic" data-icon="cross"></i></button>
    <button class="round" aria-label="Rotate piece"><i class="ic" data-icon="rotate"></i></button>
    <button class="round ok" aria-label="Confirm"><i class="ic" data-icon="check"></i></button>
  </div>

  <div class="tray" id="drawn"><i class="ic" data-icon="power"></i>From stack 1: <b>Power Plant</b></div>

  <div class="sheet tray" id="sheet">
    <div class="grab"></div>
    <div class="stepline">
      <span class="stepchip"><span class="n">1</span>Place a piece</span>
      <span class="dots"><i class="on"></i><i></i><i></i><i></i></span>
      <span class="rnd">Round <b>6</b></span>
    </div>
    <div class="instr2">Tap a lit space, rotate with ⟳, then confirm.</div>
    <div class="strip well">
      <span class="count"><i class="ic" data-icon="ore"></i><span class="num">2</span></span>
      <span class="count"><i class="ic" data-icon="plate"></i><span class="num">1</span></span>
      <span class="count" style="opacity:.5"><i class="ic" data-icon="sphere"></i><span class="num">0</span></span>
      <span class="count"><i class="ic" data-icon="tess"></i><span class="num">1</span></span>
      <span class="sep"></span>
      <span class="count"><i class="ic" data-icon="power"></i><span class="num">4</span></span>
      <span class="count"><i class="ic" data-icon="card"></i><span class="num">3</span></span>
    </div>
    <button class="btn btn-gold primary">Confirm placement</button>
  </div>
</div>
<script type="module">
import { mountTable } from './table.js';
import { hydrate, pin } from './ui.js';
hydrate();
const q = new URLSearchParams(location.search);
const legal = [[3, -2], [-3, 2], [-1, 3], [0, 3], [2, 2], [4, -1], [-3, 1]];
const t = mountTable(document.getElementById('table'), {
  camera: { viewHeight: +(q.get('vh') || 650), azimuth: +(q.get('az') ?? -60), elevation: 48, target: [+(q.get('tx') || 0), +(q.get('tz') || 0)], shift: [0, +(q.get('sy') || -0.15)] },
  highlights: legal.map((cell) => ({ cell, color: 'blue', fill: 0.14, glow: 0.45 })).concat([{ cell: [-2, 2], color: 'blue', fill: 0.22, glow: 0.8 }]),
  ghost: { cell: [-2, 2], type: 'power', k: 1 },
});
const g = t.anchor('ghost');
pin(document.getElementById('ghostBtns'), g, 0.5, 0, 0, 50);
document.getElementById('drawn').style.top = (document.getElementById('sheet').getBoundingClientRect().top - 48) + 'px';
window.__ready = true;
</script>
</body>
</html>
