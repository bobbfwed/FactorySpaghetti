<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <title>Table harness</title>
  <link rel="icon" href="data:," />
  <style>
    html, body { margin: 0; height: 100%; background: #1d130c; color: #eee; font: 13px/1.35 system-ui, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #table { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud { position: fixed; left: 8px; top: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; pointer-events: none; }
    #hud > * { pointer-events: auto; }
    #hud button, #hud select, #hud input { background: rgba(20,16,12,0.85); color: #eee; border: 1px solid #5a4a3a; border-radius: 6px; padding: 6px 9px; font: inherit; min-height: 32px; }
    #hud button[aria-pressed="true"] { background: #e8c33a; color: #16140f; border-color: #e8c33a; }
    #hud input { width: 64px; }
    #status { position: fixed; left: 8px; bottom: 8px; background: rgba(20,16,12,0.85); border: 1px solid #5a4a3a; border-radius: 6px; padding: 6px 9px; max-width: calc(100% - 32px); white-space: pre-wrap; pointer-events: none; }
    #pop { position: fixed; transform: translate(-50%, -100%); background: #fff; color: #111; border-radius: 6px; padding: 3px 7px; font-weight: 600; pointer-events: none; display: none; white-space: nowrap; box-shadow: 0 2px 8px rgba(0,0,0,0.5); }
    #pop::after { content: ''; position: absolute; left: 50%; bottom: -6px; margin-left: -6px; border: 6px solid transparent; border-bottom: 0; border-top-color: #fff; }
    body.nohud #hud, body.nohud #status { display: none; }
  </style>
</head>
<body>
  <canvas id="table"></canvas>
  <div id="hud">
    <button id="step" title="Apply one bot action">Step</button>
    <button id="play" aria-pressed="false">Play</button>
    <select id="speed" title="Actions per second">
      <option value="2">2/s</option>
      <option value="8" selected>8/s</option>
      <option value="40">40/s</option>
      <option value="400">max</option>
    </select>
    <button id="toPlace" title="Play to the next piece placement">Next placement</button>
    <button id="toRound" title="Play 5 rounds">+5 rounds</button>
    <select id="players" title="Players"><option>2</option><option>3</option><option selected>4</option></select>
    <select id="bot" title="Bots"><option value="random" selected>Random bots</option><option value="greedy">Smart bots</option></select>
    <input id="seed" type="number" value="7" title="Seed" />
    <button id="new">New game</button>
    <button id="rotL" title="Rotate the table 60 degrees anticlockwise">&#x27F2;</button>
    <button id="rotR" title="Rotate the table 60 degrees clockwise">&#x27F3;</button>
    <button id="center">Re-centre</button>
    <button id="top" aria-pressed="false">Top-down</button>
    <button id="targets" aria-pressed="false">Show targets</button>
    <button id="ghost" aria-pressed="false">Show ghost</button>
    <button id="debug" aria-pressed="false">Point roles</button>
  </div>
  <div id="status">loading models…</div>
  <div id="pop"></div>
  <script type="module" src="./table.ts"></script>
</body>
</html>
